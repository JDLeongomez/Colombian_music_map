<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colombian music</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
</head>
<body>

<div class="cx-page">

  <header style="display:flex;flex-direction:column;gap:var(--space-4);">
    <div class="cx-intro">
      <h1>Colombian music</h1>
      <p>Colombia's music divides broadly into six regions, each shaped by the country's geography and history. This page collects examples from each, plotted roughly where they originated. Select a point on the map to hear it and read more.</p>
    </div>
    <div id="region-list" class="cx-region-list"></div>
  </header>

  <div class="cx-main-grid">
    <div class="card elev-md cx-map-card">
      <div id="map-container"></div>
    </div>

    <div class="cx-side-col">
      <div id="player-card" class="card elev-md cx-player-card">
        <div class="cx-player-frame">
          <div id="player-mount" style="width:100%;height:100%;position:absolute;inset:0;"></div>
        </div>
      </div>

      <div id="detail-panel" class="card elev-md" style="padding:var(--space-4);gap:var(--space-2);"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:var(--space-3);">
    <h6 class="cx-chips-heading">All examples</h6>
    <div id="chip-list" class="cx-chip-row"></div>
  </div>
</div>

<svg id="connector-svg">
  <path id="connector-path"></path>
</svg>

<script type="module" src="js/app.js"></script>
</body>
</html>
